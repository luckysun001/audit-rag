[tool.poetry]
name = "bank-audit-rag"
version = "2.0.0"
description = "银行审计部智能检索问答系统 - 企业级 RAG 解决方案"
authors = ["Bank Audit Tech Team"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/luckysun001/audit-rag"
keywords = ["rag", "langchain", "banking", "audit", "compliance", "risk-management", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
langchain = "^0.1.0"
langchain-openai = "^0.0.5"
langchain-community = "^0.0.20"
langchain-core = "^0.1.0"
langchain-chroma = "^0.1.0"
chromadb = "^0.4.0"
openai = "^1.0.0"
pydantic = "^2.0.0"
pydantic-settings = "^2.0.0"
fastapi = "^0.100.0"
uvicorn = {extras = ["standard"], version = "^0.20.0"}
python-multipart = "^0.0.6"
python-dotenv = "^1.0.0"
structlog = "^24.0.0"
redis = "^5.0.0"
tenacity = "^8.2.0"
opentelemetry-api = "^1.0.0"
opentelemetry-sdk = "^1.0.0"
prometheus-client = "^0.20.0"
pypdf = "^4.0.0"
python-docx = "^1.1.0"
beautifulsoup4 = "^4.12.0"
lxml = "^5.0.0"
tiktoken = "^0.6.0"
numpy = "^1.26.0"
pandas = "^2.0.0"
aiofiles = "^23.0.0"
httpx = "^0.26.0"
python-magic = "^0.4.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.0.0"
pytest-asyncio = "^0.21.0"
pytest-cov = "^4.0.0"
black = "^24.0.0"
ruff = "^0.2.0"
mypy = "^1.0.0"
pre-commit = "^3.0.0"
isort = "^5.0.0"
faker = "^20.0.0"
freezegun = "^1.0.0"
responses = "^0.24.0"
types-python-magic = "^0.4.0"

[tool.poetry.group.docs.dependencies]
mkdocs = "^1.5.0"
mkdocs-material = "^9.0.0"
mkdocstrings = "^0.24.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "-v --cov=bank_audit_rag --cov-report=term-missing --cov-report=xml"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.coverage.run]
source = ["bank_audit_rag"]
omit = [
    "*/tests/*",
    "*/__init__.py",
    "*/config/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "W", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
